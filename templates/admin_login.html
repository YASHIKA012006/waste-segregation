{% extends 'admin_base.html' %}
{% block title %}Admin Login · Smart Waste Segregation{% endblock %}
{% block body_class %}admin-login-body{% endblock %}
{% block content %}
<section class="admin-login-page"><div class="admin-login-glow admin-login-glow-one"></div><div class="admin-login-glow admin-login-glow-two"></div>
  <div class="admin-login-card"><div class="admin-login-emblem" aria-hidden="true">♧</div><p class="admin-login-kicker">SMART WASTE SEGREGATION</p><h1>ADMIN PORTAL</h1><p class="admin-login-subtitle">Secure administrative access.</p>
    <form method="post" class="admin-login-form">
      <label for="admin-email">Email</label><input id="admin-email" type="email" name="email" autocomplete="username" placeholder="name@organization.com" required>
      <label for="admin-password">Password</label><input id="admin-password" type="password" name="password" autocomplete="current-password" placeholder="Enter your password" required>
      <button class="admin-login-button" type="submit">ADMIN LOGIN <span>→</span></button>
    </form><p class="admin-login-foot"><span>♧</span> Authorized administrators only</p>
  </div>
</section>
{% endblock %}
